# Publikacja generatora na GitHub Pages.
#
# Publikujemy dokładnie to, co leży w repozytorium: grafiki kafli (web/tiles/) i wygenerowane
# dane (web/data/). Nic nie jest pobierane ani budowane z zewnętrznych źródeł, więc wdrożenie
# trwa kilkanaście sekund i zawsze daje ten sam wynik, co wersja sprawdzona lokalnie.
#
# Świadomie NIE ma tu kroku `npm run build:data`: budowanie danych wymaga katalogu vendor/async
# (klon repozytorium AsyncTI4), którego w repozytorium nie ma i mieć nie powinien. Gdybyśmy
# klonowali go przy każdym wdrożeniu, opublikowane dane mogłyby po cichu różnić się od tych
# przetestowanych lokalnie — wystarczyłaby zmiana po stronie AsyncTI4.
#
# Dane buduje się lokalnie (`npm run build:data`) i zatwierdza. Smoke-test niżej sprawdza to,
# co faktycznie leży w repozytorium, więc zepsute dane zatrzymają wdrożenie zamiast trafić
# na stronę.

name: Publikacja na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # pozwala uruchomić ręcznie z zakładki Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sprawdź dane z repozytorium
        run: node scripts/smoke-test.mjs

      - name: Wyłącz Jekyll
        run: touch web/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web            # publikujemy wyłącznie katalog web/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
